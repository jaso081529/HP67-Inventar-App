name: App online veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: App-Dateien vorbereiten
        shell: bash
        run: |
          mkdir public
          cp index.html app.css app.js icon.svg manifest.webmanifest sw.js public/
          cp -R vendor public/vendor
      - name: App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
