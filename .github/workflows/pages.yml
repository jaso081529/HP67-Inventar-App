name: App online veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: App vor Veröffentlichung prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke- und Datenschutztest
        run: node tests/smoke.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: App-Dateien vorbereiten
        shell: bash
        run: |
          mkdir public
          cp index.html update.html app.css app.js smart-camera.js icon.svg manifest.webmanifest sw.js public/
          cp -R vendor public/vendor
          mkdir public/v312
          cp app.css app.js smart-camera.js public/v312/
          sed -i 's|app.css?v=312|v312/app.css|g; s|app.js?v=312|v312/app.js|g; s|smart-camera.js?v=312|v312/smart-camera.js|g' public/index.html
      - name: App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
